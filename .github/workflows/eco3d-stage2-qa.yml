name: Eco-Farm 3D · Glass UI QA
on:
  push:
    branches:
      - feature/eco3d-stage2-liquid-glass-20261104
    paths:
      - '3d/**'
      - 'ci/eco3d-glass-qa.mjs'
      - '.github/workflows/eco3d-stage2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl-mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run WebGL and mobile acceptance suite
        run: node ci/eco3d-glass-qa.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco3d-liquid-glass-screenshots
          path: artifacts/eco3d-ui/
          if-no-files-found: ignore
