<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA · Чёткость 3D</title>
<style>body{font:14px system-ui;background:#eff3ec;color:#264633;padding:20px;max-width:900px;margin:auto}iframe{width:390px;height:690px;max-width:100%;border:1px solid #a9c0ae;border-radius:12px}li{padding:8px;background:white;margin:7px 0;border-radius:7px}#summary{font-weight:bold;padding:15px;background:white}</style>
<h1>Эко-Ферма · Чёткость и сортировка</h1><p id="summary">Запускаю проверку…</p><ol id="results"></ol>
<iframe id="game" src="./index.html?qa=1" title="Проверка мобильной игры"></iframe>
<script>
(async()=>{
 const f=document.getElementById('game'),doc=()=>f.contentDocument,win=()=>f.contentWindow;
 const keys=['ecoFarm3D.stage1.qa','ecoFarm3D.story.qa','ecoFarm3D.settings.qa'],tests=[];
 const sleep=n=>new Promise(r=>setTimeout(r,n));
 const check=(v,m)=>{if(!v)throw Error(m)};
 async function until(fn,ms=22000){const start=Date.now();while(Date.now()-start<ms){try{if(fn())return}catch{}await sleep(80)}throw Error('тайм-аут '+JSON.stringify(win().__ecoErrors||[]))}
 async function test(name,fn){try{const detail=await fn();tests.push(true);add('✓ '+name+(detail?' — '+detail:''))}
 catch(e){tests.push(false);add('✕ '+name+': '+e.message);throw e}}
 function add(s){const li=document.createElement('li');li.textContent=s;document.getElementById('results').append(li)}
 try{
 await test('3D-сцена запустилась',async()=>{await until(()=>win().__eco3dBinAudit && doc().querySelectorAll('.object-item').length===6);check(win().__eco3dBinAudit().rendered,'нет WebGL')});
 await test('Пять геометрических пиктограмм',()=>{
  const a=win().__eco3dBinAudit();check(a.categoryCount===5,'не 5 контейнеров');
  check(a.pictograms.every(x=>x.count===1),'не хватает знака');return a.pictograms.map(x=>x.id).join(', ')});
 await test('Нет размытых Canvas-вывесок',()=>{check(win().__eco3dBinAudit().rasterSigns===0,'Canvas-текстуры остались')});
 await test('Чёткие и крупные HTML-названия',()=>{
  const a=[...doc().querySelectorAll('#sceneBinBar [data-bin-scene]')];
  check(a.length===5,'не 5 кнопок');
  for(const b of a){let cs=win().getComputedStyle(b),r=b.getBoundingClientRect();
   check(parseFloat(cs.fontSize)>=12,'мелкий шрифт');check(r.width>=100&&r.height>=44,'маленькая кнопка')}
 });
 await test('Разрешение адаптируется под Retina',()=>{
  const a=win().__eco3dDiagnostics(),native=win().devicePixelRatio||1;
  check(a.dpr>=1,'ошибка DPR');if(native>1.3&&!a.eco)check(a.dpr>1.05,'разрешение 1x на Retina');return a.dpr.toFixed(2)+'x'});
 await test('Режим экономии работает',()=>{
  const orig=win().__eco3dDiagnostics().eco;
  doc().getElementById('qualityToggle').click();
  check(win().__eco3dDiagnostics().eco!==orig,'не переключился');
  doc().getElementById('qualityToggle').click();
 });
 await test('Ошибка не начисляет прогресс',()=>{
  doc().querySelectorAll('.object-item')[0].click();
  doc().querySelector('[data-bin-scene="glass"]').click();
  check(doc().getElementById('missionCount').textContent.includes('0 / 6'),'прогресс изменился');
 });
 await test('Верная сортировка и сохранение',async()=>{
  doc().querySelector('[data-bin-scene="paper"]').click();
  await until(()=>doc().getElementById('missionCount').textContent.includes('1 / 6'),9000);
  const ready=new Promise(r=>f.addEventListener('load',r,{once:true}));win().location.reload();await ready;
  await until(()=>win().__eco3dBinAudit && doc().querySelectorAll('.object-item').length===6);
  check(doc().getElementById('missionCount').textContent.includes('1 / 6'),'сохранение пропало');
 });
 }catch(e){}
 const pass=tests.filter(Boolean).length;
 document.getElementById('summary').textContent='Проверки: '+pass+' / '+tests.length+' успешно';
 keys.forEach(k=>localStorage.removeItem(k));
})();
</script>
